name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: Shell script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck build.sh
        run: shellcheck --severity=warning build.sh

  test:
    name: Host tests (node choice, overrides)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NodePicker and DnsOverrides have no Android dependency: tested with plain javac + java,
      # no emulator and no Android SDK.
      - name: Run tests
        run: bash build.sh --test

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [shell, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships an Android SDK and exports ANDROID_HOME; fail early if that changes.
      - name: Check Android SDK
        run: |
          [ -d "${ANDROID_HOME:-}/platforms" ] || { echo "::error::Android SDK not found on runner"; exit 1; }
          echo "SDK: $ANDROID_HOME"

      # The project has no Gradle wrapper; AGP 8.5 needs Gradle 8.7+. setup-gradle also caches ~/.gradle
      # (only main writes the cache, other branches and PRs read it).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Secrets only hold text, so the keystore is stored base64-encoded and decoded to a temp file.
      # Without the secret (forks, pull requests) the APK is signed with the debug key instead.
      - name: Decode keystore
        env:
          EX_KEYSTORE_BASE64: ${{ secrets.EX_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$EX_KEYSTORE_BASE64" ]; then
            echo "$EX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "EX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "no EX_KEYSTORE_BASE64 secret: building with the debug key"
          fi

      # --test already ran in the previous job, so go straight to the APK.
      - name: Build
        env:
          EX_KEYSTORE_PASSWORD: ${{ secrets.EX_KEYSTORE_PASSWORD }}
          EX_KEY_ALIAS: ${{ secrets.EX_KEY_ALIAS }}
          EX_KEY_PASSWORD: ${{ secrets.EX_KEY_PASSWORD }}
        run: bash build.sh

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magic-dns-rewrite
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: magic-dns-rewrite
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
